name: Uppdatera avsnitt

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node fetch-episodes.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Spara ändringar
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add episodes.json
          git diff --staged --quiet || git commit -m "Uppdatera avsnitt"
          git push
      - name: Publicera hemsidan
        run: gh api -X POST repos/${{ github.repository }}/pages/builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}