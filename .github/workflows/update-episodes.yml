name: Uppdatera avsnitt

on:
  schedule:
    - cron: "17 7 * * *"          # varje dag 07:17 svensk tid (reserv)
      timezone: "Europe/Stockholm"
    - cron: "13-59/10 6-8 * * 4"  # torsdagar 06:13 till 08:53, var 10:e minut
      timezone: "Europe/Stockholm"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node fetch-episodes.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      - name: Spara ändringar
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add episodes.json
          git diff --staged --quiet || git commit -m "Uppdatera avsnitt"
          git push
      - name: Publicera hemsidan
        run: gh api -X POST repos/${{ github.repository }}/pages/builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}